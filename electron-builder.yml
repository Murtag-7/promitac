appId: cz.promitac.app
productName: Promítač
artifactName: Promitac-${version}-${os}-${arch}.${ext}
copyright: Promítač
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/bibles
    to: bibles
asar: true
afterPack: build/afterPack.cjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  # No paid certificate: ad-hoc signature is applied in afterPack so the app runs on Apple Silicon.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: Promítač nepoužívá kameru.
    NSMicrophoneUsageDescription: Promítač nepoužívá mikrofon.
dmg:
  title: Promítač ${version}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Promítač
  installerLanguages: [cs_CZ]
  language: '1029'
linux:
  target: [dir]
  category: Office
publish: null
