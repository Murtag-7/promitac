appId: cz.promitac.app
# The bundle name stays ASCII: on macOS the .dmg stores file names in decomposed Unicode while
# Info.plist keeps them composed, and Electron then cannot find its own helper apps and crashes at
# start (0.1.1). The Czech name is shown through CFBundleDisplayName, shortcuts and the window title.
productName: Promitac
artifactName: Promitac-${version}-${os}-${arch}.${ext}
copyright: Promítač
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/bibles
    to: bibles
asar: true
afterPack: build/afterPack.cjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  # No paid certificate: ad-hoc signature is applied in afterPack so the app runs on Apple Silicon.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    CFBundleDisplayName: Promítač
    NSCameraUsageDescription: Promítač nepoužívá kameru.
    NSMicrophoneUsageDescription: Promítač nepoužívá mikrofon.
dmg:
  title: Promitac ${version}
win:
  # Windows keeps the name it had since 0.1.0 (no problem there, and upgrades stay seamless).
  executableName: Promítač
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Promítač
  uninstallDisplayName: Promítač ${version}
  installerLanguages: [cs_CZ]
  language: '1029'
linux:
  target: [dir]
  category: Office
publish: null
