name: Build desktop apps

# macOS (.dmg, Apple Silicon + Intel) and Windows (.exe installer).
# - Pull requests to main: test builds as downloadable artifacts.
# - Run workflow (Actions → "Build desktop apps") with a version such as v0.2.0: builds and publishes
#   a GitHub Release with that tag. Without a version it is just a test build.
# - Pushing a tag v* (or publishing a release with a new tag in the GitHub UI) does the same.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Vydat verzi (např. v0.2.0). Prázdné = jen testovací build.'
        required: false
        default: ''
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_tag || 'build' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The version to publish, if any: the dispatched input or the pushed tag.
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npx electron-builder --mac --arm64 --x64 --publish never
            artifact: Promitac-macOS
            files: |
              release/*.dmg
          - name: Windows
            os: windows-latest
            command: npx electron-builder --win --x64 --publish never
            artifact: Promitac-Windows
            files: |
              release/*.exe
    env:
      # Optional: bake a Supabase project into the build so users only sign in.
      PROMITAC_SUPABASE_URL: ${{ secrets.PROMITAC_SUPABASE_URL }}
      PROMITAC_SUPABASE_ANON_KEY: ${{ secrets.PROMITAC_SUPABASE_ANON_KEY }}
      # No paid certificates: never try to find a signing identity / notarize.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Version from the release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Verze musí vypadat jako v1.2.3 (zadáno: $RELEASE_TAG)"
            exit 1
          fi
          npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"
      - run: npm ci
      - run: npm run build
      - name: Package
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on the built commit when it does not exist yet (Run workflow).
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Promítač ${{ env.RELEASE_TAG }}
          files: dist-artifacts/**/*
          draft: false
          generate_release_notes: true
